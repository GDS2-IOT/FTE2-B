<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Einrichten · Freistunden.exe</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="kopf" class="kopf"></header>

  <main>
    <div class="wrap">
      <form id="formular" class="karte formularseite" novalidate>
        <h1>Admin-Konto einrichten</h1>
        <p class="muted">Das geht nur einmal. Mit diesem Konto legst du später die Schülerkonten und Gruppen an.</p>
        <label class="feld">
          <span>Einrichtungscode</span>
          <input id="code" type="text" inputmode="numeric" autocomplete="off" required autofocus>
          <small>Der 6-stellige Code steht im schwarzen Server-Fenster (bzw. im Server-Log).</small>
        </label>
        <label class="feld">
          <span>Benutzername</span>
          <input id="benutzername" type="text" value="admin" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </label>
        <label class="feld">
          <span>Anzeigename</span>
          <input id="anzeigename" type="text" value="Admin" required>
          <small>So erscheinst du in den Ranglisten.</small>
        </label>
        <label class="feld">
          <span>Passwort (mind. 8 Zeichen)</span>
          <input id="passwort" type="password" autocomplete="new-password" required minlength="8">
        </label>
        <label class="feld">
          <span>Passwort wiederholen</span>
          <input id="passwort2" type="password" autocomplete="new-password" required>
        </label>
        <p id="fehler" class="fehlermeldung" role="alert"></p>
        <button class="btn primaer" type="submit">Admin-Konto anlegen</button>
      </form>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script>
    (async () => {
      const status = await IO.start('');
      if (status.eingerichtet) { location.href = status.ich ? '/admin.html' : '/login.html'; return; }
      const $ = IO.$;
      const fehler = $('#fehler');
      $('#formular').addEventListener('submit', async (e) => {
        e.preventDefault();
        fehler.textContent = '';
        if ($('#passwort').value.length < 8) { fehler.textContent = 'Das Passwort muss mindestens 8 Zeichen haben.'; return; }
        if ($('#passwort').value !== $('#passwort2').value) { fehler.textContent = 'Die Passwörter stimmen nicht überein.'; return; }
        try {
          await IO.api('/api/einrichten', {
            methode: 'POST',
            daten: {
              code: $('#code').value.trim(),
              benutzername: $('#benutzername').value.trim(),
              anzeigename: $('#anzeigename').value.trim(),
              passwort: $('#passwort').value,
            },
          });
          location.href = '/admin.html';
        } catch (err) {
          fehler.textContent = err.message;
        }
      });
    })();
  </script>
</body>
</html>
